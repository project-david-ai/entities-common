
name: 🧹 Lint, Test, Tag, and Publish

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - main

# CI is read-only. Only the main-branch release job
# may write commits and tags.
permissions:
  contents: read

env:
  PROD_PYPI_URL: https://upload.pypi.org/legacy/

jobs:
  lint:
    name: 🧹 Lint & Security
    runs-on: ubuntu-latest

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-lint-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-lint-pip-

      - name: 🔧 Install lint dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install --index-url https://pypi.org/simple/ -e ".[dev]"

      - name: ⚫ Run Black (Format Check)
        run: black --check .

      - name: ⚫ Run isort (Import Sort Check)
        run: isort --check .

      - name: 🔒 Run Bandit (Security Scan)
        run: bandit -r src/ -c .bandit.yml || true

      - name: 🔍 Run Mypy (Type Check)
        run: mypy src/ --ignore-missing-imports || true

  test:
    name: ✅ Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 📦 Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-

      - name: 🔧 Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install --index-url https://pypi.org/simple/ -e ".[dev]"

      - name: ✅ Run tests
        run: pytest tests/

  release:
    name: 🚀 Tag, Build, and Publish
    runs-on: ubuntu-latest
    needs: test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: write

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🔧 Install build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel build
          pip install --index-url https://pypi.org/simple/ -e ".[dev]"

      - name: 🚀 Setup Node.js for semantic-release
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🔧 Install semantic-release and plugins
        run: |
          npm install -g semantic-release \
            @semantic-release/git \
            @semantic-release/changelog \
            @semantic-release/github \
            @semantic-release/exec \
            conventional-changelog-conventionalcommits

      - name: 🔎 Read current package version
        id: before
        shell: bash
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: 🔢 Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: 🔎 Check for a new package version
        id: after
        shell: bash
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if [[ "$version" == "${{ steps.before.outputs.version }}" ]]; then
            echo "No version change: skip build and PyPI publication"
          else
            echo "New package version: $version"
          fi

      - name: 🏗️ Build Python package
        if: steps.before.outputs.version != steps.after.outputs.version
        run: python -m build

      - name: 🛡️ Verify build artifacts
        if: steps.before.outputs.version != steps.after.outputs.version
        run: |
          ls -lh dist
          test -n "$(ls -A dist 2>/dev/null)" || (echo "dist/ is empty — build failed." && exit 1)

      - name: 📦 Publish to Production PyPI
        if: steps.before.outputs.version != steps.after.outputs.version
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: "__token__"
          password: ${{ secrets.PROD_PYPI_TOKEN }}
          repository_url: ${{ env.PROD_PYPI_URL }}
          skip-existing: true
